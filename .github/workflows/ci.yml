name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Scenario tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Production route smoke
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/migration-factory-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/migration-factory-next.log
            exit 1
          fi

          routes=(
            "/"
            "/angular/migrations/new"
            "/angular/preflights/preflight-angular-11-crud-example-11-21"
            "/angular/migrations/run-angular-action"
            "/java/migrations/new"
            "/java/migrations/java-order-service"
            "/java/migrations/java-repair-service"
            "/java/migrations/java-terminal-service"
            "/java/migrations/java-terminal-service/artifacts/migration-report.md"
          )

          for route in "${routes[@]}"; do
            code=$(curl --silent --show-error --output /tmp/route-body --write-out "%{http_code}" "http://127.0.0.1:3000${route}")
            if [ "$code" -ne 200 ]; then
              echo "Route failed: ${route} (HTTP ${code})"
              cat /tmp/route-body
              cat /tmp/migration-factory-next.log
              exit 1
            fi
          done
